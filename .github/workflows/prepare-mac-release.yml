name: Prepare signed Mac release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example 0.2.0
        required: true
        type: string
      build_number:
        description: Strictly increasing Sparkle build number
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: macos-15
    # Apple's first notarization for a new app can take materially longer than
    # the usual few-minute path. Keep the runner alive long enough to receive
    # and staple the ticket instead of leaving an unusable half-release.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build the Mac story editor
        run: npm ci && npm run mac:typecheck && npm run mac:editor-test && npm run mac:editor

      - name: Validate release inputs and secrets
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
          TRANSCRIPTION_WORKFLOW_URL: ${{ secrets.TRANSCRIPTION_WORKFLOW_URL }}
          STORY_WORKFLOW_URL: ${{ secrets.STORY_WORKFLOW_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          if (( 10#$BUILD_NUMBER < 1 )); then
            echo "The Sparkle build number must be positive." >&2
            exit 1
          fi
          if [[ -z "$SPARKLE_PRIVATE_KEY" || -z "$DEVELOPER_ID_P12_BASE64" || -z "$DEVELOPER_ID_P12_PASSWORD" || -z "$APPLE_NOTARY_KEY" || -z "$APPLE_NOTARY_KEY_ID" || -z "$APPLE_NOTARY_ISSUER_ID" ]]; then
            echo "Configure the Sparkle, Developer ID, and Apple notarization release credentials." >&2
            exit 1
          fi
          if [[ -z "$GA4_MEASUREMENT_ID" || -z "$GA4_API_SECRET" ]]; then
            echo "Configure both GA4 runtime values before preparing a release." >&2
            exit 1
          fi
          if [[ -z "$TRANSCRIPTION_WORKFLOW_URL" || -z "$STORY_WORKFLOW_URL" ]]; then
            echo "Configure both managed AI workflow URLs before preparing a release." >&2
            exit 1
          fi
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq 'map(select(.draft == false and .prerelease == false)) | first | .tag_name // empty')
          if [[ -n "$latest_tag" ]]; then
            mkdir -p "$RUNNER_TEMP/latest-release"
            gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern appcast.xml --dir "$RUNNER_TEMP/latest-release"
            latest_build=$(/usr/bin/xmllint \
              --xpath 'string((//*[local-name()="enclosure"][1]/@*[local-name()="version"] | //*[local-name()="version"][1])[1])' \
              "$RUNNER_TEMP/latest-release/appcast.xml")
            if [[ ! "$latest_build" =~ ^[0-9]+$ ]]; then
              echo "The latest published appcast does not contain a numeric build version." >&2
              exit 1
            fi
            if (( 10#$BUILD_NUMBER <= 10#$latest_build )); then
              echo "Build $BUILD_NUMBER must be greater than published build $latest_build." >&2
              exit 1
            fi
          fi

      # Run Keychain integration coverage before replacing the runner's keychain search list
      # with the temporary keychain that contains the Developer ID signing identity.
      - name: Test the Mac app
        run: swift test

      - name: Install the Developer ID certificate and notarization key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/jessee-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "developer-id.p12").write_bytes(
              base64.b64decode(os.environ["DEVELOPER_ID_P12_BASE64"])
          )
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          signing_identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application: OPLEVEL AI LLC/ { print $2; exit }')
          if [[ -z "$signing_identity" ]]; then
            echo "The imported archive does not contain the OPLEVEL Developer ID Application identity." >&2
            exit 1
          fi
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key"
          chmod 600 "$notary_key"
          echo "JESSEE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Package the signed and notarized release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          JESSEE_GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          JESSEE_GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
          JESSEE_TRANSCRIPTION_WORKFLOW_URL: ${{ secrets.TRANSCRIPTION_WORKFLOW_URL }}
          JESSEE_STORY_WORKFLOW_URL: ${{ secrets.STORY_WORKFLOW_URL }}
        run: mac/Support/package-release.sh "${{ inputs.version }}" "${{ inputs.build_number }}"

      - name: Create the reviewable draft release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="v$version"
          assets=(
            mac/build/installers/JesSee.dmg
            "mac/build/releases/JesSee-$version.zip"
            mac/build/releases/appcast.xml
            "mac/build/releases/JesSee-$version.md"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on the published release $tag. Choose a new version." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "JesSee $version" \
              --notes-file "mac/build/releases/JesSee-$version.md"
          fi

          echo "Prepared a signed and notarized JesSee $version draft. Publishing the draft activates the website installer and Sparkle feed." >> "$GITHUB_STEP_SUMMARY"
